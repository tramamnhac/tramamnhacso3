    }
    @media (max-width:390px){
      .event-time-item{min-width:calc(25% - 8px)}
      .event-time-item strong{font-size:1.08rem}
      .singer-grid{gap:10px}
      .singer-info{padding:11px 10px 13px}
      .singer-info h3{font-size:1rem}
    }
    @media (prefers-reduced-motion:reduce){.singer-card,.singer-image-wrap img{transition:none}}

  
/* CMS-rendered content helpers */
.brand-logo{display:block;max-width:150px;max-height:48px;object-fit:contain}.brand-text{display:block}.hidden-section{display:none!important}.hero-poster-wrap{width:min(100%,1040px)}.hero-poster{width:100%;height:auto;aspect-ratio:auto;object-fit:contain}.hero{background-image:var(--hero-bg)}.programme-copy{width:100%}.cms-loading{padding:24px;text-align:center;color:#b8b3c9}

<body>
  <header class="nav" id="siteNav"><div class="wrap nav-inner"><a class="brand" id="brandTop" href="#home" aria-label="Về đầu trang"></a><button class="menu-toggle" id="menuToggle" aria-label="Mở menu" aria-expanded="false">☰</button><nav class="nav-links" id="navLinks" aria-label="Điều hướng chính"></nav></div></header>
  <main id="siteMain"><div class="cms-loading">Đang tải nội dung chương trình…</div></main>
  <footer id="siteFooter"></footer>
  <script>
  const fallbackData = {"siteTitle":"Trạm Âm nhạc số 3 – Mơ về nơi xa lắm","metaDescription":"Chương trình âm nhạc Trạm Âm nhạc số 3 – Mơ về nơi xa lắm tại Thanh Hóa.","theme":{"background":"#080710","panel":"#11101c","text":"#f8f6ff","muted":"#b8b3c9","primary":"#ff3d8d","secondary":"#9c6bff","maxWidth":1200},"logo":{"imageUrl":"","text":"THANH HÓA FMF","tagline":"FASHION · MUSIC · LIFESTYLE","link":"#home"},"navigation":[{"label":"Trang chủ","url":"#home","enabled":true},{"label":"Giới thiệu","url":"#chuong-trinh","enabled":true},{"label":"Ca sĩ","url":"#ca-si","enabled":true},{"label":"Bài hát","url":"#bai-hat","enabled":true}],"hero":{"enabled":true,"backgroundImage":"assets/hero-background.jpg","bannerImage":"assets/hero-banner.jpg","bannerAlt":"Banner Trạm Âm nhạc số 3 – Mơ về nơi xa lắm","eventTime":"20:10","eventDate":"2026-10-23T20:10:00+07:00","countdownLabel":"ĐẾM NGƯỢC ĐẾN CHƯƠNG TRÌNH","buttonLabel":"Xem chi tiết","buttonUrl":"#chuong-trinh","showCountdown":true},"programme":{"enabled":true,"id":"chuong-trinh","menuLabel":"Giới thiệu","eyebrow":"Câu chuyện sự kiện","title":"Chương trình","description":"Một không gian hội tụ thời trang, âm nhạc và phong cách sống dành cho cộng đồng yêu nghệ thuật.","subEyebrow":"Điểm hẹn cảm xúc","headline":"Thăng hoa cùng những sắc màu sáng tạo","paragraph1":"Thanh Hóa Fashion & Music Festival là điểm gặp gỡ của âm nhạc, thời trang và phong cách sống. Chương trình hướng tới một trải nghiệm nghệ thuật trẻ trung, giàu năng lượng, nơi nghệ sĩ, thương hiệu và khán giả cùng kết nối.","paragraph2":"Chương trình là điểm hẹn dành cho khán giả yêu âm nhạc và những cảm xúc chân thành.","tags":[{"text":"Trình diễn thời trang"},{"text":"Âm nhạc trực tiếp"},{"text":"Kết nối sáng tạo"}],"videoTitle":"Video chương trình","videoDescription":"Những khoảnh khắc và nội dung nổi bật của chương trình.","youtubeUrl":""},"singers":{"enabled":true,"eyebrow":"Line-up","title":"Ca sĩ","description":"Những ca sĩ góp mặt tại đêm nhạc","buttonLabel":"Danh sách bài hát","buttonUrl":"#bai-hat","items":[{"name":"Hoành Nhật Minh","role":"Ca sĩ","image":"assets/hoanh-nhat-minh.jpg","alt":"Ảnh Hoành Nhật Minh"},{"name":"Công Đại","role":"Ca sĩ","image":"assets/cong-dai.jpg","alt":"Ảnh Công Đại"},{"name":"Như Quỳnh","role":"Ca sĩ","image":"assets/nhu-quynh.jpg","alt":"Ảnh Như Quỳnh"},{"name":"Huệ Anh","role":"Ca sĩ","image":"assets/hue-anh.jpg","alt":"Ảnh Huệ Anh"},{"name":"Chill Band","role":"Nhóm nhạc","image":"assets/chill-band.jpg","alt":"Ảnh Chill Band"},{"name":"Thùy Dung","role":"Ca sĩ / Dẫn chương trình","image":"assets/thuy-dung.jpg","alt":"Ảnh Thùy Dung"}]},"songs":{"enabled":true,"eyebrow":"Setlist","title":"Các bài hát trong chương trình","description":"Những giai điệu sẽ tạo nên cảm xúc của đêm nhạc.","items":[{"title":"Hà Nội và em khi thu chớm đông sang","performer":""},{"title":"Im lặng đêm Hà Nội","performer":""},{"title":"Em ơi Hà Nội phố","performer":""},{"title":"Hà Nội ngày trở về","performer":""},{"title":"Nỗi nhớ mùa đông","performer":""},{"title":"Một dại khờ, một tôi","performer":""},{"title":"Biển, nỗi nhớ và em","performer":""},{"title":"Thương lắm tóc dài ơi","performer":""},{"title":"Mơ về nơi xa lắm","performer":""},{"title":"Khúc mùa thu","performer":""},{"title":"Đâu phải bởi mùa thu","performer":""},{"title":"Mùa thu dấu em","performer":""},{"title":"Về lại phố xưa","performer":""},{"title":"Điều giản dị","performer":""}]},"footer":{"enabled":true,"brandTitle":"THANH HÓA FMF","tagline":"FASHION · MUSIC · LIFESTYLE","description":"Trạm Âm nhạc số 3 – Mơ về nơi xa lắm. Một đêm nhạc của những giai điệu và cảm xúc.","email":"","phone":"","address":"","copyright":"© 2026 Trạm Âm nhạc số 3. Bảo lưu mọi quyền.","note":""}};
  const esc = (v='') => String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = (v='') => /^(https?:\/\/|\/|#|assets\/|\.\/)/i.test(String(v)) ? String(v) : '#';
  function assetUrl(v='') { const s=String(v||'').trim(); if(!s) return ''; if(/^(https?:)?\/\//i.test(s) || /^data:/i.test(s)) return s; const clean=s.replace(/^\.\//,'').replace(/^\/+/, ''); return new URL(clean, document.baseURI).href; }
  function youtubeId(url='') { const s=String(url).trim(); if(!s)return ''; try { const u=new URL(s); if(u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0]||''; if(u.hostname.includes('youtube.com')) return u.searchParams.get('v') || (u.pathname.match(/\/embed\/([^/]+)/)||[])[1] || (u.pathname.match(/\/shorts\/([^/]+)/)||[])[1] || ''; } catch(e){} return /^[\w-]{11}$/.test(s)?s:''; }
  function brandMarkup(logo, fallbackTitle){ return logo.imageUrl ? `<img class="brand-logo" src="${esc(assetUrl(logo.imageUrl))}" alt="${esc(logo.text||fallbackTitle)}"><span>${esc(logo.tagline||'')}</span>` : `<span class="brand-text">${esc(logo.text||fallbackTitle)}</span><span>${esc(logo.tagline||'')}</span>`; }
  function render(data){
    const root=document.documentElement, theme=data.theme||{};
    root.style.setProperty('--bg',theme.background||'#080710'); root.style.setProperty('--panel',theme.panel||'#11101c'); root.style.setProperty('--ink',theme.text||'#f8f6ff'); root.style.setProperty('--muted',theme.muted||'#b8b3c9'); root.style.setProperty('--pink',theme.primary||'#ff3d8d'); root.style.setProperty('--violet',theme.secondary||'#9c6bff'); root.style.setProperty('--max',(Number(theme.maxWidth)||1200)+'px');
    document.title=data.siteTitle||'Landing page'; document.querySelector('meta[name="description"]').content=data.metaDescription||''; document.querySelector('meta[name="theme-color"]').content=theme.background||'#080710';
    const logo=data.logo||{}; const brand=brandMarkup(logo,data.siteTitle); document.getElementById('brandTop').innerHTML=brand; document.getElementById('brandTop').href=safeUrl(logo.link||'#home');
    const nav=(data.navigation||[]).filter(x=>x.enabled!==false); document.getElementById('navLinks').innerHTML=nav.map(n=>`<a href="${esc(safeUrl(n.url))}">${esc(n.label)}</a>`).join('');
    const h=data.hero||{}, p=data.programme||{}, singers=data.singers||{}, songs=data.songs||{}, foot=data.footer||{};
    const hero=h.enabled===false?'':`<section class="hero" id="home" aria-label="${esc(data.siteTitle)}" style="--hero-bg:url('${esc(assetUrl(h.backgroundImage||'assets/hero-background.jpg'))}')"><div class="hero-overlay"></div><div class="wrap hero-content"><div class="hero-poster-wrap">${h.bannerImage?`<img class="hero-poster" src="${esc(assetUrl(h.bannerImage))}" alt="${esc(h.bannerAlt||'Banner chương trình')}">`:''}</div><div class="event-time-row"><div class="event-time-item"><span>Giờ</span><strong>${esc(h.eventTime||'20:10')}</strong></div><div class="event-time-item"><span>Ngày</span><strong id="eventDay">23</strong></div><div class="event-time-item"><span>Tháng</span><strong id="eventMonth">10</strong></div><div class="event-time-item"><span>Năm</span><strong id="eventYear">2026</strong></div></div>${h.showCountdown!==false?`<div class="countdown-label">${esc(h.countdownLabel||'ĐẾM NGƯỢC ĐẾN CHƯƠNG TRÌNH')}</div><div class="countdown" id="countdown"></div><div class="countdown-status" id="countdownStatus"></div>`:''}<a class="btn btn-primary" href="${esc(safeUrl(h.buttonUrl||'#chuong-trinh'))}">${esc(h.buttonLabel||'Xem chi tiết')} <span class="btn-arrow">↓</span></a></div></section>`;
    const programme=p.enabled===false?'':`<section class="section programme" id="${esc(p.id||'chuong-trinh')}"><div class="wrap"><div class="section-heading"><span class="eyebrow">${esc(p.eyebrow||'Chương trình')}</span><h2 class="gradient-text">${esc(p.title||'Chương trình')}</h2><p>${esc(p.description||'')}</p></div><article class="programme-card"><div class="programme-copy"><span class="eyebrow">${esc(p.subEyebrow||'')}</span><h3>${esc(p.headline||'')}</h3><p>${esc(p.paragraph1||'')}</p>${p.paragraph2?`<p>${esc(p.paragraph2)}</p>`:''}<div class="programme-points">${(p.tags||[]).map(t=>`<span>${esc(t.text||t)}</span>`).join('')}</div></div></article><div class="video-wrap"><div class="video-title"><h3>${esc(p.videoTitle||'Video chương trình')}</h3><p>${esc(p.videoDescription||'')}</p></div><div class="video-frame" id="videoFrame"><div class="video-placeholder"><div class="play-icon">▶</div><strong>Khu vực video YouTube</strong><span>Nhập URL video YouTube trong Pages CMS để hiển thị tại đây.</span></div></div></div></div></section>`;
    const singerSection=singers.enabled===false?'':`<section class="section singers" id="ca-si"><div class="wrap"><div class="section-heading"><span class="eyebrow">${esc(singers.eyebrow||'Line-up')}</span><h2 class="gradient-text">${esc(singers.title||'Ca sĩ')}</h2><p>${esc(singers.description||'')}</p></div><div class="singer-grid">${(singers.items||[]).map(s=>`<article class="singer-card"><div class="singer-image-wrap">${s.image?`<img loading="lazy" src="${esc(assetUrl(s.image))}" alt="${esc(s.alt||s.name)}">`:''}<div class="singer-image-shade"></div></div><div class="singer-info"><small>${esc(s.role||'Ca sĩ')}</small><h3>${esc(s.name||'')}</h3>${s.description?`<p>${esc(s.description)}</p>`:''}</div></article>`).join('')}</div>${singers.buttonLabel?`<div class="singer-cta"><a class="btn btn-ghost" href="${esc(safeUrl(singers.buttonUrl||'#bai-hat'))}">${esc(singers.buttonLabel)} <span class="btn-arrow">↗</span></a></div>`:''}</div></section>`;
    const songLinks=(songs.socialLinks||[]).filter(x=>x.enabled!==false && x.label && x.url && /^https?:\/\//i.test(String(x.url).trim()));
    const socialLinksBlock=songLinks.length?`<div class="social-links-wrap">${songs.linksTitle?`<h3 class="social-links-title">${esc(songs.linksTitle)}</h3>`:''}${songs.linksDescription?`<p class="social-links-description">${esc(songs.linksDescription)}</p>`:''}<div class="social-links">${songLinks.map(x=>`<a class="social-link" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.label)} <span aria-hidden="true">↗</span></a>`).join('')}</div></div>`:'';
    const songSection=songs.enabled===false?'':`<section class="section songs" id="bai-hat"><div class="wrap"><div class="section-heading"><span class="eyebrow">${esc(songs.eyebrow||'Setlist')}</span><h2 class="gradient-text">${esc(songs.title||'Các bài hát trong chương trình')}</h2><p>${esc(songs.description||'')}</p></div><div class="song-list">${(songs.items||[]).map((s,i)=>`<article class="song-item"><span class="song-number">${String(i+1).padStart(2,'0')}</span><div class="song-copy"><h3>${esc(s.title||'')}</h3>${s.performer?`<p>${esc(s.performer)}</p>`:''}</div></article>`).join('')}</div>${socialLinksBlock}</div></section>`;
    document.getElementById('siteMain').innerHTML=hero+programme+singerSection+songSection;
    document.getElementById('siteFooter').style.display=foot.enabled===false?'none':'';
    document.getElementById('siteFooter').innerHTML=foot.enabled===false?'':`<div class="wrap"><div class="footer-top"><div class="footer-brand"><a class="brand" href="${esc(safeUrl(logo.link||'#home'))}">${brandMarkup({imageUrl:logo.imageUrl,text:foot.brandTitle||logo.text,tagline:foot.tagline||logo.tagline},foot.brandTitle||data.siteTitle)}</a><p>${esc(foot.description||'')}</p>${foot.address?`<p>${esc(foot.address)}</p>`:''}${foot.phone?`<p>Điện thoại: ${esc(foot.phone)}</p>`:''}${foot.email?`<p>Email: <a href="mailto:${esc(foot.email)}">${esc(foot.email)}</a></p>`:''}</div><div class="footer-links">${nav.map(n=>`<a href="${esc(safeUrl(n.url))}">${esc(n.label)}</a>`).join('')}${foot.contactLabel?`<a href="${esc(foot.email?'mailto:'+foot.email:safeUrl(foot.contactUrl||'#'))}">${esc(foot.contactLabel)}</a>`:''}</div></div><div class="footer-bottom"><span>${esc(foot.copyright||'')}</span><span>${esc(foot.note||'')}</span></div></div>`;
    if(h.enabled!==false){const dt=new Date(h.eventDate||'2026-10-23T20:10:00+07:00'); if(!isNaN(dt)){document.getElementById('eventDay').textContent=String(dt.getDate()).padStart(2,'0');document.getElementById('eventMonth').textContent=String(dt.getMonth()+1).padStart(2,'0');document.getElementById('eventYear').textContent=dt.getFullYear();} if(h.showCountdown!==false) startCountdown(h.eventDate);}
    const vid=youtubeId(p.youtubeUrl||''); if(vid){document.getElementById('videoFrame').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}" title="${esc(p.videoTitle||'Video chương trình')}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;}
    const toggle=document.getElementById('menuToggle'), links=document.getElementById('navLinks'); toggle.addEventListener('click',()=>{const open=links.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'×':'☰';}); links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{links.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.textContent='☰';}));
  }
  function startCountdown(dateString){const el=document.getElementById('countdown'), status=document.getElementById('countdownStatus'); if(!el||!status)return; const target=new Date(dateString||'2026-10-23T20:10:00+07:00').getTime(); function tick(){const rem=target-Date.now(); if(rem<=0){el.innerHTML=['Ngày','Giờ','Phút','Giây'].map(x=>`<div class="time-box"><strong>00</strong><span>${x}</span></div>`).join('');status.textContent='Sự kiện đã đến thời điểm tổ chức. Cập nhật ngày sự kiện trong CMS nếu lịch thay đổi.';return;} const vals=[Math.floor(rem/86400000),Math.floor(rem%86400000/3600000),Math.floor(rem%3600000/60000),Math.floor(rem%60000/1000)];el.innerHTML=vals.map((v,i)=>`<div class="time-box"><strong>${String(v).padStart(2,'0')}</strong><span>${['Ngày','Giờ','Phút','Giây'][i]}</span></div>`).join('');status.textContent='Thời gian còn lại đến giờ khai mạc.';setTimeout(tick,1000);}tick();}
  fetch('data/site.json').then(r=>{if(!r.ok)throw new Error('No site data');return r.json()}).then(render).catch(()=>render(fallbackData));
  </script>
